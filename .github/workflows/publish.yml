name: Generate & Deploy

on:
  schedule:
    # 毎日 21:00 UTC (日本時間 6:00) に実行
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      generate:
        description: "新しい記事を生成する"
        type: boolean
        default: true
      count:
        description: "生成する記事数(1〜5)。定期実行は常に1本"
        type: number
        default: 1
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate new post
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          count=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            count="${{ inputs.count }}"
          fi
          if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -lt 1 ] || [ "$count" -gt 5 ]; then
            echo "count は 1〜5 で指定してください"
            exit 1
          fi
          set +e
          ok=0
          for i in $(seq 1 "$count"); do
            echo "=== ${i}/${count} ==="
            python scripts/generate_post.py
            if [ $? -eq 0 ]; then
              ok=1
            else
              echo "記事 ${i} の生成に失敗しました。成功した分だけ公開します。"
            fi
          done
          set -e
          if [ "$ok" = 0 ]; then
            exit 1
          fi

      - name: Commit generated content
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add content/posts
          if [ -f scripts/topics_state.json ]; then git add scripts/topics_state.json; fi
          git diff --cached --quiet || git commit -m "chore: auto-generate new post"
          git push

      - name: Build site
        run: python scripts/build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
