{% extends "base.html" %}
{% block content %}
<section class="post-list">
  {% for post in posts %}
  <article class="post-card">
    <h2><a href="{{ site.base_url }}posts/{{ post.slug }}/">{{ post.title }}</a></h2>
    <p class="meta">{{ post.date }}</p>
    <p class="excerpt">{{ post.description }}</p>
    <div class="tags">
      {% for tag in post.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}
    </div>
  </article>
  {% else %}
  <p>まだ記事がありません。もうすぐ最初の記事が公開されます。</p>
  {% endfor %}
</section>
{% endblock %}
