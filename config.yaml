# サイト全体の設定
site:
  title: "AIとガジェットの使い方ラボ"
  description: "AIツール・アプリ・ガジェットを使いこなすための実践Tipsを毎日発信するブログ"
  # GitHub Pagesで公開する場合、最終的なURLに書き換えてください
  # 例: https://<username>.github.io/<repo>/
  base_url: "https://ai-gadget-lab.github.io/"
  language: "ja"
  author: "AIとガジェットの使い方ラボ 編集部"
  # お問い合わせ用メールアドレス
  contact_email: "aigadgetlab@proton.me"
  # AdSenseやアフィリエイトの審査が通ったら、ここにコードやリンクを追加していきます
  monetization:
    # 発行者ID。Googleアカウントのメールを変えてもこの値は変わらない。
    # 別のAdSenseアカウントを作り直した場合だけ、新しい ca-pub- に差し替える。
    adsense_client_id: "ca-pub-4485176465052867"
    # 手動広告ユニットの数字ID。空なら自動広告(headのスクリプト)のみ。
    adsense_slot_id: ""
    affiliate_disclosure: "本サイトの記事内には広告・アフィリエイトリンクが含まれる場合があります。"

# 記事生成の設定
generation:
  posts_per_run: 1
  min_words: 900
  max_words: 1600
  model: "gemini-3.6-flash"
